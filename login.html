<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محلك - إنشاء حساب</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary: #0F2C59;
            --secondary: #D86438;
            --bg-color: #EBF1F5;
            --card-bg: #FFFFFF;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            display: flex;
            flex-direction: column;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .auth-card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 4px 15px rgba(15, 44, 89, 0.08);
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .brand-header {
            text-align: center;
            margin-bottom: 10px;
        }

        .logo-title {
            font-size: 26px;
            font-weight: 900;
            color: var(--primary);
        }

        .logo-tagline {
            font-size: 12px;
            font-weight: bold;
            color: var(--secondary);
            margin-top: -2px;
        }

        .auth-title {
            font-size: 16px;
            font-weight: bold;
            color: var(--primary);
            text-align: center;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .label {
            font-size: 12px;
            font-weight: bold;
            color: var(--primary);
        }

        .input-field {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #DCE4EC;
            border-radius: 12px;
            font-size: 13px;
            outline: none;
            background: #F9FBFD;
        }

        .input-field:focus {
            border-color: var(--primary);
            background: #FFF;
        }

        .avatar-upload {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }

        .avatar-box {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: #F0F4F8;
            border: 2px dashed #B8C7D8;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--secondary);
            font-size: 24px;
        }

        .submit-btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            box-shadow: 0 4px 12px rgba(15, 44, 89, 0.2);
            text-align: center;
            text-decoration: none;
            display: block;
        }
    </style>
</head>
<body>

    <div class="auth-card">
        <div class="brand-header">
            <div class="logo-title">محلك 🛍️</div>
            <div class="logo-tagline">خليك في محلك</div>
        </div>

        <div class="auth-title">إنشاء حساب جديد</div>

        <!-- رفع اللوجو / الصورة -->
        <div class="avatar-upload">
            <div class="avatar-box">
                <i class="fa-solid fa-camera"></i>
            </div>
            <span class="label">رفع صورة الحساب / شعار المحل</span>
        </div>

        <!-- اسم الحساب -->
        <div class="input-group">
            <label class="label">الاسم الكامل / اسم المحل التجاري</label>
            <input type="text" class="input-field" placeholder="مثال: متجر الأناقة / أحمد محمد">
        </div>

        <!-- رقم الجوال -->
        <div class="input-group">
            <label class="label">رقم الجوال (الواتساب)</label>
            <input type="tel" class="input-field" placeholder="مثال: 0912345678">
        </div>

        <!-- المدينة -->
        <div class="input-group">
            <label class="label">المدينة / الولاية</label>
            <input type="text" class="input-field" placeholder="مثال: الخرطوم، أمدرمان، عطبرة...">
        </div>

        <!-- زر الدخول -->
        <a href="index.html" class="submit-btn">
            ابـدأ الآن 🚀
        </a>
    </div>

</body>
</html>
