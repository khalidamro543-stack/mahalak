<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - محلك</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --primary: #0F2C59; --secondary: #D86438; --bg-color: #EBF1F5; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { background-color: var(--bg-color); display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
        .card { background: #fff; padding: 30px 20px; border-radius: 20px; width: 100%; max-width: 380px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); text-align: center; }
        .logo-title { font-size: 26px; font-weight: 900; color: var(--primary); margin-bottom: 5px; }
        .subtitle { font-size: 13px; color: #666; margin-bottom: 20px; }
        .input-group { margin-bottom: 12px; }
        .input-group input { width: 100%; padding: 12px 15px; border: 1px solid #DCE4EC; border-radius: 10px; font-size: 13px; outline: none; }
        .btn { width: 100%; background: var(--primary); color: #fff; border: none; padding: 12px; border-radius: 10px; font-size: 14px; font-weight: bold; cursor: pointer; margin-top: 5px; }
        .toggle-btn { margin-top: 15px; background: none; border: none; color: var(--secondary); font-size: 12px; font-weight: bold; cursor: pointer; text-decoration: underline; }
        .home-link { display: block; margin-top: 15px; color: var(--secondary); font-size: 12px; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>

    <div class="card">
        <div class="logo-title">محلك 🛍️</div>
        <div class="subtitle" id="form-subtitle">سجل دخولك لمتابعة عروضك</div>

        <form id="auth-form">
            <div class="input-group">
                <input type="text" id="phone" required placeholder="رقم الهاتف (مثال: 249912345678)">
            </div>
            <div class="input-group">
                <input type="password" id="password" required placeholder="كلمة المرور">
            </div>
            <button type="submit" class="btn" id="submit-btn">دخول</button>
        </form>

        <button class="toggle-btn" onclick="toggleMode()" id="toggle-btn">ليس لديك حساب؟ أنشئ حساباً جديداً</button>
        <a href="index.html" class="home-link">العودة للرئيسية</a>
    </div>

    <script>
        const SUPABASE_URL = 'https://iagvkchymgvewvivxilv.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_l2lB13ZRtO41IUXZMBWVmw_tSwstU74';

        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        let isSignUp = false;

        function toggleMode() {
            isSignUp = !isSignUp;
            document.getElementById('form-subtitle').innerText = isSignUp ? 'أنشئ حسابك الجديد في ثوانٍ' : 'سجل دخولك لمتابعة عروضك';
            document.getElementById('submit-btn').innerText = isSignUp ? 'إنشاء حساب' : 'دخول';
            document.getElementById('toggle-btn').innerText = isSignUp ? 'لديك حساب بالفعل؟ سجل الدخول' : 'ليس لديك حساب؟ أنشئ حساباً جديداً';
        }

        document.getElementById('auth-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const phone = document.getElementById('phone').value.trim();
            const password = document.getElementById('password').value.trim();

            if (isSignUp) {
                // إنشاء حساب
                const { data: existing } = await _supabase.from('users').select('*').eq('phone', phone);
                if (existing && existing.length > 0) {
                    alert('هذا الرقم مسجل بالفعل!');
                    return;
                }

                const { error } = await _supabase.from('users').insert([{ phone, password }]);
                if (error) {
                    alert('حدث خطأ أثناء إنشاء الحساب.');
                } else {
                    localStorage.setItem('user_phone', phone);
                    alert('تم إنشاء الحساب وتسجيل الدخول بنجاح! 🎉');
                    window.location.href = 'index.html';
                }
            } else {
                // تسجيل الدخول
                const { data, error } = await _supabase.from('users').select('*').eq('phone', phone).eq('password', password);
                if (data && data.length > 0) {
                    localStorage.setItem('user_phone', phone);
                    alert('أهلاً بك! تم تسجيل الدخول بنجاح.');
                    window.location.href = 'index.html';
                } else {
                    alert('رقم الهاتف أو كلمة المرور غير صحيحة.');
                }
            }
        });
    </script>
</body>
</html>
