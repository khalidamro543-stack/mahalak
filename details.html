<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محلك - تفاصيل العرض</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root { --primary: #0F2C59; --secondary: #D86438; --bg-color: #EBF1F5; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { background-color: var(--bg-color); padding: 15px; }
        .card { background: #fff; border-radius: 16px; padding: 20px; text-align: center; }
        .btn-back { display: inline-block; margin-top: 15px; color: var(--primary); text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>

    <div class="card">
        <i class="fa-solid fa-circle-info fa-3x" style="color: var(--primary); margin-bottom: 15px;"></i>
        <h2>تفاصيل العرض</h2>
        <p style="color: #666; margin-top: 10px;">يمكنك التواصل المباشر مع صاحب العرض عبر زر الواتساب في الصفحة الرئيسية.</p>
        <a href="index.html" class="btn-back">⬅️ العودة للصفحة الرئيسية</a>
    </div>

</body>
</html>
