<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نزّل عرضك - محلك</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --primary: #0F2C59; --secondary: #D86438; --bg-color: #EBF1F5; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { background-color: var(--bg-color); padding: 20px; padding-bottom: 100px; }
        .form-card { background: #fff; padding: 20px; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); max-width: 450px; margin: auto; }
        .form-title { text-align: center; color: var(--primary); font-size: 20px; font-weight: bold; margin-bottom: 15px; }
        .input-group { margin-bottom: 12px; }
        .input-group label { display: block; font-size: 12px; font-weight: bold; margin-bottom: 5px; color: #444; }
        .input-group input, .input-group textarea, .input-group select { width: 100%; padding: 10px; border: 1px solid #DCE4EC; border-radius: 8px; font-size: 13px; outline: none; }
        .submit-btn { width: 100%; background: var(--primary); color: #fff; border: none; padding: 12px; border-radius: 8px; font-size: 14px; font-weight: bold; cursor: pointer; margin-top: 10px; }
    </style>
</head>
<body>

    <div class="form-card">
        <div class="form-title">نزّل عرضك الجديد 🛍️</div>
        <form id="add-form">
            <div class="input-group">
                <label>نوع المنشور</label>
                <select id="post_type" onchange="togglePriceInput(this.value)">
                    <option value="sale">عرض منتج للبيع 🛍️</option>
                    <option value="marketing">تسويق وإعلان فقط 📢</option>
                </select>
            </div>
            <div class="input-group">
                <label>الفئة</label>
                <select id="category">
                    <option value="ملابس">ملابس 👗</option>
                    <option value="عطور">عطور 🧴</option>
                    <option value="مطاعم وكافيهات">مطاعم وكافيهات 🍔</option>
                    <option value="أجهزة">أجهزة 📱</option>
                    <option value="مركبات">مركبات 🚗</option>
                    <option value="توصيل طلبات">توصيل طلبات 🛵</option>
                </select>
            </div>
            <div class="input-group">
                <label>عنوان العرض / الخدمة</label>
                <input type="text" id="title" required placeholder="مثال: آيفون اكس عادي / توصيل سريع">
            </div>
            <div class="input-group" id="price-group">
                <label>السعر (بالجنيه)</label>
                <input type="number" id="price" placeholder="مثال: 20000">
            </div>
            <div class="input-group">
                <label>التفاصيل</label>
                <textarea id="description" rows="3" placeholder="وصف العرض بالكامل..."></textarea>
            </div>
            <div class="input-group">
                <label>رقم الواتساب للتواصل (بدون +)</label>
                <input type="text" id="phone" required placeholder="249912345678">
            </div>
            <div class="input-group">
                <label>صور المنتج (يمكن اختيار أكثر من صورة)</label>
                <input type="file" id="image-files" accept="image/*" multiple>
            </div>
            <button type="submit" class="submit-btn" id="submit-btn">انشر العرض هسي 🚀</button>
        </form>
    </div>

    <script>
        const SUPABASE_URL = 'https://iagvkchymgvewvivxilv.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_l2lB13ZRtO41IUXZMBWVmw_tSwstU74';

        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        function togglePriceInput(val) {
            document.getElementById('price-group').style.display = val === 'marketing' ? 'none' : 'block';
        }

        document.getElementById('add-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submit-btn');
            btn.disabled = true;
            btn.innerText = 'جاري رفع البيانات والتنسيق...';

            const post_type = document.getElementById('post_type').value;
            const category = document.getElementById('category').value;
            const title = document.getElementById('title').value;
            const price = document.getElementById('price').value;
            const description = document.getElementById('description').value;
            const phone = document.getElementById('phone').value;
            const files = document.getElementById('image-files').files;

            // جلب اسم المحل المسجل للحساب
            let shopName = 'محلك';
            const { data: userData } = await _supabase.from('users').select('shop_name').eq('phone', phone);
            if (userData && userData.length > 0 && userData[0].shop_name) {
                shopName = userData[0].shop_name;
            }

            let imageUrls = [];

            if (files.length > 0) {
                for (let i = 0; i < files.length; i++) {
                    const file = files[i];
                    const fileName = `${Date.now()}_${i}.${file.name.split('.').pop()}`;
                    const { data } = await _supabase.storage.from('products').upload(fileName, file);
                    if (data) {
                        const { data: pubData } = _supabase.storage.from('products').getPublicUrl(fileName);
                        imageUrls.push(pubData.publicUrl);
                    }
                }
            }

            const mainImageUrl = imageUrls.length > 0 ? imageUrls[0] : null;

            const { error } = await _supabase.from('products').insert([
                { title, price: post_type === 'sale' ? price : null, description, phone, image_url: mainImageUrl, images: imageUrls, post_type, category, shop_name: shopName }
            ]);

            if (!error) {
                alert('تم نشر عرضك بنجاح! 🎉');
                window.location.href = 'index.html';
            } else {
                alert('حدث خطأ أثناء النشر.');
                btn.disabled = false;
                btn.innerText = 'انشر العرض هسي 🚀';
            }
        });
    </script>
</body>
</html>
