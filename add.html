<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نزّل عرضك - محلك</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --primary: #0F2C59; --secondary: #D86438; --bg-color: #EBF1F5; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { background-color: var(--bg-color); padding: 20px; padding-bottom: 100px; }
        .form-card { background: #fff; padding: 20px; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); max-width: 450px; margin: auto; }
        .form-title { text-align: center; color: var(--primary); font-size: 20px; font-weight: bold; margin-bottom: 15px; }
        .input-group { margin-bottom: 12px; }
        .input-group label { display: block; font-size: 12px; font-weight: bold; margin-bottom: 5px; color: #444; }
        .input-group input, .input-group textarea { width: 100%; padding: 10px; border: 1px solid #DCE4EC; border-radius: 8px; font-size: 13px; outline: none; }
        .submit-btn { width: 100%; background: var(--primary); color: #fff; border: none; padding: 12px; border-radius: 8px; font-size: 14px; font-weight: bold; cursor: pointer; margin-top: 10px; }
    </style>
</head>
<body>

    <div class="form-card">
        <div class="form-title">نزّل عرضك الجديد 🛍️</div>
        <form id="add-form">
            <div class="input-group">
                <label>اسم المنتج / العرض</label>
                <input type="text" id="title" required placeholder="مثال: بجامات أطفال">
            </div>
            <div class="input-group">
                <label>السعر (بالجنيه)</label>
                <input type="number" id="price" required placeholder="مثال: 20000">
            </div>
            <div class="input-group">
                <label>التفاصيل</label>
                <textarea id="description" rows="3" placeholder="وصف المنتج، الخامة، المقاسات..."></textarea>
            </div>
            <div class="input-group">
                <label>رقم الواتساب (بدون +)</label>
                <input type="text" id="phone" required placeholder="249912345678">
            </div>
            <div class="input-group">
                <label>صورة المنتج (اختياري)</label>
                <input type="file" id="image-file" accept="image/*">
            </div>
            <button type="submit" class="submit-btn" id="submit-btn">انشر العرض هسي 🚀</button>
        </form>
    </div>

    <script>
        const SUPABASE_URL = 'https://iagvkchymgvewvivxilv.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_l2lB13ZRtO41IUXZMBWVmw_tSwstU74';

        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        document.getElementById('add-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submit-btn');
            btn.disabled = true;
            btn.innerText = 'جاري النشر وتنسيق الصورة...';

            const title = document.getElementById('title').value;
            const price = document.getElementById('price').value;
            const description = document.getElementById('description').value;
            const phone = document.getElementById('phone').value;
            const imageFile = document.getElementById('image-file').files[0];

            let imageUrl = null;

            if (imageFile) {
                const fileExt = imageFile.name.split('.').pop();
                const fileName = `${Date.now()}.${fileExt}`;

                const { data: uploadData, error: uploadError } = await _supabase.storage
                    .from('products')
                    .upload(fileName, imageFile);

                if (uploadError) {
                    alert('خطأ في رفع الصورة: ' + uploadError.message);
                    btn.disabled = false;
                    btn.innerText = 'انشر العرض هسي 🚀';
                    return;
                }

                const { data: publicUrlData } = _supabase.storage
                    .from('products')
                    .getPublicUrl(fileName);

                imageUrl = publicUrlData.publicUrl;
            }

            const { error } = await _supabase.from('products').insert([
                { title, price, description, phone, image_url: imageUrl }
            ]);

            if (error) {
                alert('حدث خطأ أثناء النشر، حاول مرة أخرى.');
                btn.disabled = false;
                btn.innerText = 'انشر العرض هسي 🚀';
            } else {
                alert('تم نشر عرضك بنجاح! 🎉');
                window.location.href = 'index.html';
            }
        });
    </script>
</body>
</html>
